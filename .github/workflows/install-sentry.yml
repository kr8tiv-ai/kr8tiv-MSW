name: Install Sentry Dependencies
on:
  workflow_dispatch:
jobs:
  install-sentry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install @sentry/node
        run: npm install @sentry/node
      - name: Commit changes
        run: |
          git config user.name "Matt Haynes"
          git config user.email "matt@kr8tiv.ai"
          git add package.json package-lock.json
          git commit -m "chore: install @sentry/node for error tracking"
          git push